<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agendamento de Consulta</title>
    <link rel="stylesheet" href="agendamento.css">
</head>
<body>

    <h1> Agendamento de Consulta </h1>

    <form action="#" method="post">

        <div class="form-group">
            <label for="nome">Nome do paciente:</label>
            <input type="text" id="nome" name="nome" placeholder="Digite o seu nome completo" required>
        </div>

        <div class="form-group">
            <label for="cpf">CPF:</label>
            <input type="text" id="cpf" name="cpf" maxlength="14" placeholder="000.000.000-00" required>
        </div>

        <div class="form-group">
            <label for="email">E-mail:</label>
            <input type="email" id="email" name="email" placeholder="seuemail@exemplo.com">
        </div>

        <div class="form-group">
            <label for="telefone">Telefone:</label>
            <input type="tel" id="telefone" name="telefone" placeholder="(00) 00000-0000" required>
        </div>

        <div class="form-group">
            <label for="especialidade">Especialidade:</label>
            <select id="especialidade" name="especialidade" required>
                <option value="" disabled selected>Selecione uma especialidade</option>
                <option value="Clínica Geral">Clínica Geral</option>
                <option value="Pediatria">Pediatria</option>
                <option value="Cardiologia">Cardiologia</option>
                <option value="Dermatologia">Dermatologia</option>
            </select>
        </div>

        <div class="form-group">
            <label for="data_desejada">Data desejada:</label>
            <input type="date" id="data_desejada" name="data_desejada" required>
        </div>

        <div class="form-group">
            <p class="label-title">Período de preferência:</p>
            <div class="radio-group">
                <input type="radio" id="manha" name="periodo" value="Manhã">
                <label for="manha">Manhã</label>
            </div>
            <div class="radio-group">
                <input type="radio" id="tarde" name="periodo" value="Tarde">
                <label for="tarde">Tarde</label>
            </div>
        </div>

        <div class="form-group">
            <label for="observacoes">Observações:</label>
            <textarea id="observacoes" name="observacoes" rows="4" placeholder="Alguma observação importante?"></textarea>
        </div>

        <div class="form-group checkbox-group">
            <input type="checkbox" id="confirmacao" name="confirmacao" required>
            <label for="confirmacao">Confirmo que os dados informados estão corretos.</label>
        </div>

        <button type="submit">Solicitar consulta</button>

    </form>

</body>
</html>
